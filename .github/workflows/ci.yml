name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: pokemon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d pokemon_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Nur Testwerte für die Wegwerf-Datenbank dieses Jobs
    env:
      DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5432/pokemon_e2e
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-chars
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-password
      E2E_BASE_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Auf main bestehen noch Lint-Fehler, deshalb vorerst nicht blockierend
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Testdatenbank vorbereiten
        run: |
          npx prisma db push
          node e2e/seed-test-db.mjs

      - name: Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: App starten
        run: |
          npx next start -p 3001 -H 127.0.0.1 &
          for attempt in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:3001/login && exit 0
            sleep 1
          done
          echo "App nicht erreichbar" >&2
          exit 1

      - name: E2E-Tests
        run: npm run test:e2e

      - name: Playwright-Ergebnisse sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/pokemonwebsite-playwright-results
          if-no-files-found: ignore
          retention-days: 7
